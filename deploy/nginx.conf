# Static hosting for the KaziSpace H5 web app.
# Assets use absolute paths (/static/...), so serve this site at a domain root.

server {
    listen 80;
    server_name app.kazispace.ai;

    root /var/www/kazirobotics-website;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    server_name app.kazispace.ai;

    ssl_certificate /etc/nginx/ssl/live/app.kazispace.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/app.kazispace.ai/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/kazirobotics-website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
